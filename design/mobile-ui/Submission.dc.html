<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>제출물 심사 · HACKMAN</title>
<script src="./support.js"></script>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Public+Sans:wght@400;500;600;700&display=swap">
</head>
<body>
<x-dc>
<helmet>
<style>
  body{margin:0;background:#F6F4EF;font-family:'Public Sans',sans-serif;color:#17181D;}
  a{text-decoration:none;color:inherit;}
  button{font-family:inherit;border:none;cursor:pointer;}
</style>
</helmet>
<div style="width:390px;height:844px;box-sizing:border-box;background:#F6F4EF;display:flex;flex-direction:column;overflow:hidden;">

  <div style="padding:18px 16px;display:flex;align-items:center;gap:10px;border-bottom:1px solid #E5E2D8;background:#FFFFFF;">
    <a href="ContestDetail.dc.html" aria-label="뒤로가기" style="width:36px;height:36px;display:flex;align-items:center;justify-content:center;border-radius:10px;">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none"><path d="M15 6l-6 6 6 6" stroke="#17181D" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></svg>
    </a>
    <span style="font-size:15px;font-weight:700;">제출물 심사</span>
    <span style="margin-left:auto;font-size:12px;color:#9A978C;">3 / 18</span>
  </div>

  <div style="flex-grow:1;overflow:hidden;padding:18px 20px 0 20px;display:flex;flex-direction:column;gap:18px;">

    <div style="background:#FFFFFF;border:1px solid #E5E2D8;border-radius:16px;padding:16px;">
      <div style="display:flex;align-items:center;gap:10px;margin-bottom:8px;">
        <div style="width:38px;height:38px;border-radius:9px;background:#EDEBFC;display:flex;align-items:center;justify-content:center;font-size:15px;">🤖</div>
        <div>
          <div style="font-size:15px;font-weight:700;">AI 회의록 요약봇</div>
          <div style="font-size:12px;color:#9A978C;">Team Nova · 4인</div>
        </div>
      </div>
      <p style="margin:0 0 10px 0;font-size:13px;line-height:1.6;color:#3A3C43;">회의 녹음을 실시간으로 텍스트화하고 핵심 결정사항, 액션 아이템을 자동 요약해주는 슬랙 봇입니다.</p>
      <div style="display:flex;gap:6px;">
        <span style="background:#F1EFE7;font-size:11px;padding:3px 8px;border-radius:20px;color:#5B5E68;">Whisper</span>
        <span style="background:#F1EFE7;font-size:11px;padding:3px 8px;border-radius:20px;color:#5B5E68;">Claude API</span>
        <span style="background:#F1EFE7;font-size:11px;padding:3px 8px;border-radius:20px;color:#5B5E68;">Slack</span>
      </div>
    </div>

    <sc-if value="{{submitted}}" hint-placeholder-val="{{false}}">
      <div style="background:#E7F6EF;border:1px solid #0E9F6E;border-radius:14px;padding:16px;text-align:center;display:flex;flex-direction:column;align-items:center;gap:6px;">
        <svg width="28" height="28" viewBox="0 0 24 24" fill="none"><path d="M4 12l5 5L20 6" stroke="#0E9F6E" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/></svg>
        <span style="font-size:14px;font-weight:700;color:#0E9F6E;">심사 결과가 제출되었습니다</span>
      </div>
    </sc-if>

    <sc-if value="{{notSubmitted}}" hint-placeholder-val="{{true}}">
    <div style="display:flex;flex-direction:column;gap:16px;overflow:hidden;">
      <sc-for list="{{criteria}}" as="c" hint-placeholder-count="3">
        <div style="display:flex;flex-direction:column;gap:8px;">
          <div style="display:flex;justify-content:space-between;">
            <span style="font-size:13px;font-weight:600;">{{c.label}}</span>
            <span style="font-size:13px;font-weight:700;color:#4F46E5;">{{c.value}}/5</span>
          </div>
          <div style="display:flex;gap:6px;">
            <sc-for list="{{c.dots}}" as="d" hint-placeholder-count="5">
              <button onClick="{{d.pick}}" style="{{d.style}}" aria-label="{{d.aria}}"></button>
            </sc-for>
          </div>
        </div>
      </sc-for>
    </div>
    </sc-if>
  </div>

  <sc-if value="{{notSubmitted}}" hint-placeholder-val="{{true}}">
  <div style="padding:14px 20px calc(14px + env(safe-area-inset-bottom, 0px)) 20px;border-top:1px solid #E5E2D8;background:#FFFFFF;display:flex;gap:10px;">
    <button onClick="{{reject}}" style="flex:1;height:48px;border-radius:12px;border:1px solid #E5E2D8;background:#FFFFFF;font-size:14px;font-weight:700;color:#DC2626;">반려</button>
    <button onClick="{{confirm}}" style="flex:1.4;height:48px;border-radius:12px;background:#17181D;color:#F6F4EF;font-size:14px;font-weight:700;">심사 제출</button>
  </div>
  </sc-if>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { creativity: 4, completeness: 3, feasibility: 4, submitted: false };
  }
  buildRow(label, key) {
    const value = this.state[key];
    const dots = [1, 2, 3, 4, 5].map((n) => ({
      aria: label + ' ' + n + '점',
      pick: () => this.setState({ [key]: n }),
      style: 'width:32px;height:32px;border-radius:8px;' +
        (n <= value ? 'background:#4F46E5;' : 'background:#EDEBFC;')
    }));
    return { label, value, dots };
  }
  renderVals() {
    return {
      submitted: this.state.submitted,
      notSubmitted: !this.state.submitted,
      criteria: [
        this.buildRow('창의성', 'creativity'),
        this.buildRow('완성도', 'completeness'),
        this.buildRow('실현가능성', 'feasibility')
      ],
      reject: () => this.setState({ submitted: true }),
      confirm: () => this.setState({ submitted: true })
    };
  }
}
</script>
</body>
</html>
