<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>프로필 · HACKMAN</title>
<script src="./support.js"></script>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Public+Sans:wght@400;500;600;700&display=swap">
</head>
<body>
<x-dc>
<helmet>
<style>
  body{margin:0;background:#F6F4EF;font-family:'Public Sans',sans-serif;color:#17181D;}
  a{text-decoration:none;color:inherit;}
  button{font-family:inherit;border:none;cursor:pointer;background:none;}
  input,textarea{font-family:inherit;}
  input::placeholder,textarea::placeholder{color:#9A978C;}
  .navlink svg{display:block;}
</style>
</helmet>
<div style="width:390px;height:844px;box-sizing:border-box;background:#F6F4EF;display:flex;flex-direction:column;overflow:hidden;position:relative;">

  <div style="padding:22px 20px 8px 20px;display:flex;align-items:center;justify-content:space-between;">
    <span style="font-family:'Public Sans',sans-serif;font-weight:700;font-size:25px;">프로필</span>

  </div>

  <div style="flex-grow:1;overflow:hidden;padding:8px 20px 0 20px;display:flex;flex-direction:column;gap:20px;">

    <div style="background:#FFFFFF;border:1px solid #E5E2D8;border-radius:18px;padding:20px;display:flex;flex-direction:column;align-items:center;gap:10px;">
      <div style="width:72px;height:72px;border-radius:50%;background:#17181D;display:flex;align-items:center;justify-content:center;font-size:22px;font-weight:700;color:#F6F4EF;">지현</div>
      <div style="text-align:center;">
        <div style="font-size:17px;font-weight:700;">김지현</div>
        <div style="font-size:13px;color:#5B5E68;margin-top:2px;">심사위원 · Team Nova</div>
      </div>
      <div style="display:flex;gap:6px;flex-wrap:wrap;justify-content:center;">
        <sc-for list="{{savedStack}}" as="s" hint-placeholder-count="3">
          <span style="background:#EDEBFC;color:#4F46E5;font-size:11px;font-weight:700;padding:3px 9px;border-radius:20px;">{{s.label}}</span>
        </sc-for>
      </div>
      <button onClick="{{openEdit}}" style="height:38px;padding:0 18px;border-radius:10px;border:1px solid #E5E2D8;font-size:13px;font-weight:700;margin-top:4px;">프로필 편집</button>
    </div>

    <div style="display:flex;gap:10px;">
      <div style="flex:1;background:#FFFFFF;border:1px solid #E5E2D8;border-radius:14px;padding:14px;text-align:center;">
        <div style="font-size:20px;font-weight:700;">5</div><div style="font-size:12px;color:#5B5E68;">참가 대회</div>
      </div>
      <div style="flex:1;background:#FFFFFF;border:1px solid #E5E2D8;border-radius:14px;padding:14px;text-align:center;">
        <div style="font-size:20px;font-weight:700;">2</div><div style="font-size:12px;color:#5B5E68;">수상</div>
      </div>
      <div style="flex:1;background:#FFFFFF;border:1px solid #E5E2D8;border-radius:14px;padding:14px;text-align:center;">
        <div style="font-size:20px;font-weight:700;">8</div><div style="font-size:12px;color:#5B5E68;">제출</div>
      </div>
    </div>

    <div style="display:flex;flex-direction:column;background:#FFFFFF;border:1px solid #E5E2D8;border-radius:16px;overflow:hidden;">
      <div style="display:flex;align-items:center;gap:12px;padding:14px 16px;border-bottom:1px solid #F1EFE7;">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none"><rect x="3" y="5" width="18" height="14" rx="2" stroke="#5B5E68" stroke-width="1.8"></rect><path d="M3 7l9 6 9-6" stroke="#5B5E68" stroke-width="1.8"></path></svg>
        <span style="flex-grow:1;font-size:14px;font-weight:600;">계정 정보</span>
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none"><path d="M9 6l6 6-6 6" stroke="#9A978C" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"></path></svg>
      </div>
      <div style="display:flex;align-items:center;gap:12px;padding:14px 16px;border-bottom:1px solid #F1EFE7;">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none"><path d="M6 9a6 6 0 1 1 12 0c0 4 1.5 5.5 1.5 5.5H4.5S6 13 6 9Z" stroke="#5B5E68" stroke-width="1.8" stroke-linejoin="round"></path><path d="M10 18a2 2 0 0 0 4 0" stroke="#5B5E68" stroke-width="1.8"></path></svg>
        <span style="flex-grow:1;font-size:14px;font-weight:600;">알림 설정</span>
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none"><path d="M9 6l6 6-6 6" stroke="#9A978C" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"></path></svg>
      </div>
      <div style="display:flex;align-items:center;gap:12px;padding:14px 16px;">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none"><path d="M20 14.5A8 8 0 1 1 9.5 4a6.5 6.5 0 0 0 10.5 10.5Z" stroke="#5B5E68" stroke-width="1.8" stroke-linejoin="round"></path></svg>
        <span style="flex-grow:1;font-size:14px;font-weight:600;">다크 모드</span>
        <button onClick="{{toggleDark}}" aria-label="다크 모드 전환" style="width:46px;height:26px;border-radius:14px;position:relative;padding:0;{{trackStyle}}">
          <span style="position:absolute;top:2px;width:22px;height:22px;border-radius:50%;background:#FFFFFF;transition:left .15s ease;{{knobStyle}}"></span>
        </button>
      </div>
    </div>

    <button style="display:flex;align-items:center;justify-content:center;gap:8px;height:48px;border-radius:12px;background:#FDE8E8;color:#DC2626;font-size:14px;font-weight:700;">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none"><path d="M15 17l5-5-5-5M20 12H9M13 5H6a2 2 0 0 0-2 2v10a2 2 0 0 0 2 2h7" stroke="#DC2626" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"></path></svg>
      로그아웃
    </button>
  </div>

  <div style="display:flex;align-items:center;justify-content:space-around;padding:10px 8px calc(10px + env(safe-area-inset-bottom, 0px)) 8px;border-top:1px solid #E5E2D8;background:#FFFFFF;">
    <a href="Main.dc.html" class="navlink" style="display:flex;flex-direction:column;align-items:center;gap:4px;min-width:44px;min-height:44px;justify-content:center;color:#9A978C;">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none"><path d="M4 11l8-7 8 7v9a1 1 0 0 1-1 1h-5v-6h-4v6H5a1 1 0 0 1-1-1v-9Z" stroke="#9A978C" stroke-width="2" stroke-linejoin="round"></path></svg>
      <span style="font-size:11px;font-weight:600;">홈</span>
    </a>
    <a href="Gallery.dc.html" class="navlink" style="display:flex;flex-direction:column;align-items:center;gap:4px;min-width:44px;min-height:44px;justify-content:center;color:#9A978C;">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none"><path d="M4 5h16v14H4z" stroke="#9A978C" stroke-width="2"></path><path d="M4 15l4-4 4 4 3-3 5 5" stroke="#9A978C" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"></path></svg>
      <span style="font-size:11px;font-weight:600;">갤러리</span>
    </a>
    <a href="Submission.dc.html" class="navlink" style="display:flex;flex-direction:column;align-items:center;gap:4px;min-width:44px;min-height:44px;justify-content:center;color:#9A978C;">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none"><rect x="4" y="4" width="16" height="16" rx="3" stroke="#9A978C" stroke-width="2"></rect><path d="M9 12h6M12 9v6" stroke="#9A978C" stroke-width="2" stroke-linecap="round"></path></svg>
      <span style="font-size:11px;font-weight:600;">제출현황</span>
    </a>
    <a href="Profile.dc.html" class="navlink" style="display:flex;flex-direction:column;align-items:center;gap:4px;min-width:44px;min-height:44px;justify-content:center;color:#17181D;">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none"><circle cx="12" cy="8" r="3.2" stroke="#17181D" stroke-width="2"></circle><path d="M5 20c1.2-3.6 4-5.4 7-5.4s5.8 1.8 7 5.4" stroke="#17181D" stroke-width="2" stroke-linecap="round"></path></svg>
      <span style="font-size:11px;font-weight:700;">프로필</span>
    </a>
  </div>

  <sc-if value="{{editing}}" hint-placeholder-val="{{false}}">
    <div style="position:absolute;inset:0;background:rgba(23,24,29,0.45);display:flex;flex-direction:column;justify-content:flex-end;">
      <div style="background:#F6F4EF;border-radius:20px 20px 0 0;max-height:82%;display:flex;flex-direction:column;overflow:hidden;">

        <div style="display:flex;align-items:center;justify-content:space-between;padding:16px 18px;border-bottom:1px solid #E5E2D8;flex-shrink:0;">
          <span style="font-size:16px;font-weight:700;">프로필 편집</span>
          <button onClick="{{closeEdit}}" aria-label="닫기" style="width:32px;height:32px;display:flex;align-items:center;justify-content:center;border-radius:8px;">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none"><path d="M6 6l12 12M18 6L6 18" stroke="#17181D" stroke-width="2" stroke-linecap="round"></path></svg>
          </button>
        </div>

        <div style="overflow:hidden;padding:18px;display:flex;flex-direction:column;gap:18px;">

          <label style="display:flex;flex-direction:column;gap:6px;font-size:13px;font-weight:600;color:#3A3C43;">
            자기소개
            <textarea placeholder="한 줄로 나를 소개해보세요" style="height:64px;border-radius:10px;border:1px solid #E5E2D8;background:#FFFFFF;padding:10px 12px;font-size:14px;color:#17181D;resize:none;">AI 서비스와 백엔드 개발에 관심이 많은 주니어 개발자입니다.</textarea>
          </label>

          <div style="display:flex;flex-direction:column;gap:8px;">
            <span style="font-size:13px;font-weight:600;color:#3A3C43;">기술 스택</span>
            <div style="display:flex;gap:8px;flex-wrap:wrap;">
              <sc-for list="{{stackOptions}}" as="opt" hint-placeholder-count="8">
                <button onClick="{{opt.toggle}}" style="{{opt.style}}">{{opt.label}}</button>
              </sc-for>
            </div>
          </div>

          <label style="display:flex;flex-direction:column;gap:6px;font-size:13px;font-weight:600;color:#3A3C43;">
            GitHub 프로젝트 링크
            <input type="url" placeholder="https://github.com/username/project" value="https://github.com/jihyun-kim/meeting-summarizer" style="height:46px;border-radius:10px;border:1px solid #E5E2D8;background:#FFFFFF;padding:0 12px;font-size:14px;color:#17181D;">
          </label>

          <label style="display:flex;flex-direction:column;gap:6px;font-size:13px;font-weight:600;color:#3A3C43;">
            포트폴리오 / 노션 링크
            <input type="url" placeholder="https://" style="height:46px;border-radius:10px;border:1px solid #E5E2D8;background:#FFFFFF;padding:0 12px;font-size:14px;color:#17181D;">
          </label>
        </div>

        <div style="padding:14px 18px calc(14px + env(safe-area-inset-bottom, 0px)) 18px;border-top:1px solid #E5E2D8;background:#FFFFFF;display:flex;gap:10px;flex-shrink:0;">
          <button onClick="{{closeEdit}}" style="flex:1;height:48px;border-radius:12px;border:1px solid #E5E2D8;font-size:14px;font-weight:700;">취소</button>
          <button onClick="{{saveEdit}}" style="flex:1.4;height:48px;border-radius:12px;background:#17181D;color:#F6F4EF;font-size:14px;font-weight:700;">저장</button>
        </div>
      </div>
    </div>
  </sc-if>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = {
      dark: false,
      editing: false,
      selectedStack: { 'React': true, 'Python': true, 'Node.js': false, 'TypeScript': true, 'AWS': false, 'Figma': false, 'Docker': false, 'PostgreSQL': false }
    };
  }
  renderVals() {
    const dark = this.state.dark;
    const selected = this.state.selectedStack;
    const labels = Object.keys(selected);
    const stackOptions = labels.map((label) => {
      const on = selected[label];
      return {
        label,
        toggle: () => this.setState({ selectedStack: { ...selected, [label]: !on } }),
        style: 'height:34px;padding:0 14px;border-radius:20px;font-size:13px;font-weight:600;' +
          (on ? 'background:#17181D;color:#F6F4EF;' : 'background:#FFFFFF;color:#5B5E68;border:1px solid #E5E2D8;')
      };
    });
    const savedStack = labels.filter((l) => selected[l]).map((l) => ({ label: l }));
    return {
      toggleDark: () => this.setState({ dark: !dark }),
      trackStyle: 'background:' + (dark ? '#17181D' : '#E5E2D8') + ';',
      knobStyle: dark ? 'left:22px;' : 'left:2px;',
      editing: this.state.editing,
      openEdit: () => this.setState({ editing: true }),
      closeEdit: () => this.setState({ editing: false }),
      saveEdit: () => this.setState({ editing: false }),
      stackOptions,
      savedStack
    };
  }
}
</script>
</body>
</html>
