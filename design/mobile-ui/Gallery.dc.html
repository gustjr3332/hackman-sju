<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>갤러리 · HACKMAN</title>
<script src="./support.js"></script>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Public+Sans:wght@400;500;600;700&display=swap">
</head>
<body>
<x-dc>
<helmet>
<style>
  body{margin:0;background:#F6F4EF;font-family:'Public Sans',sans-serif;color:#17181D;}
  a{text-decoration:none;color:inherit;}
  button{font-family:inherit;border:none;cursor:pointer;}
</style>
</helmet>
<div style="width:390px;height:844px;box-sizing:border-box;background:#F6F4EF;display:flex;flex-direction:column;overflow:hidden;">

  <div style="padding:18px 16px;display:flex;align-items:center;gap:10px;border-bottom:1px solid #E5E2D8;background:#FFFFFF;">
    <a href="Main.dc.html" aria-label="뒤로가기" style="width:36px;height:36px;display:flex;align-items:center;justify-content:center;border-radius:10px;">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none"><path d="M15 6l-6 6 6 6" stroke="#17181D" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></svg>
    </a>
    <span style="font-size:15px;font-weight:700;">프로젝트 갤러리</span>
  </div>

  <div style="display:flex;gap:8px;padding:14px 20px 4px 20px;overflow:hidden;">
    <sc-for list="{{chips}}" as="chip" hint-placeholder-count="5">
      <button onClick="{{chip.pick}}" style="{{chip.style}}">{{chip.label}}</button>
    </sc-for>
  </div>

  <div style="flex-grow:1;overflow:hidden;padding:12px 20px 20px 20px;">
    <div style="display:grid;grid-template-columns:repeat(2, minmax(0, 1fr));gap:12px;">
      <sc-for list="{{items}}" as="item" hint-placeholder-count="6">
        <div style="background:#FFFFFF;border:1px solid #E5E2D8;border-radius:14px;overflow:hidden;">
          <div style="height:88px;background:{{item.bg}};display:flex;align-items:center;justify-content:center;font-size:26px;">{{item.emoji}}</div>
          <div style="padding:10px;">
            <div style="font-size:13px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;">{{item.title}}</div>
            <div style="font-size:11px;color:#9A978C;margin-top:2px;">{{item.team}}</div>
            <sc-if value="{{item.award}}" hint-placeholder-val="{{false}}">
              <span style="display:inline-block;margin-top:6px;background:#FEF3C7;color:#D97706;font-size:10px;font-weight:700;padding:2px 7px;border-radius:20px;">{{item.awardLabel}}</span>
            </sc-if>
          </div>
        </div>
      </sc-for>
    </div>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { filter: 'all' };
    this.ALL = [
      { title: 'AI 회의록 요약봇', team: 'Team Nova', cat: 'ai', emoji: '🤖', bg: '#EDEBFC', award: true, awardLabel: '대상' },
      { title: '동네 중고 마켓', team: 'Team Local', cat: 'web', emoji: '🛒', bg: '#E7F6EF', award: false, awardLabel: '' },
      { title: '운동 폼 교정 앱', team: 'Team Flex', cat: 'mobile', emoji: '🏃', bg: '#FEF3C7', award: false, awardLabel: '' },
      { title: '픽셀 던전 러너', team: 'Team Byte', cat: 'game', emoji: '🎮', bg: '#FDE8E8', award: false, awardLabel: '' },
      { title: '문서 Q&A 챗봇', team: 'Team Nova', cat: 'ai', emoji: '💬', bg: '#EDEBFC', award: true, awardLabel: '우수상' },
      { title: '팀 일정 조율 웹', team: 'Team Sync', cat: 'web', emoji: '📅', bg: '#E7F6EF', award: false, awardLabel: '' }
    ];
  }
  renderVals() {
    const cats = [
      ['all', '전체'], ['ai', 'AI'], ['web', '웹'], ['mobile', '모바일'], ['game', '게임']
    ];
    const chips = cats.map(([key, label]) => ({
      label,
      pick: () => this.setState({ filter: key }),
      style: 'height:32px;padding:0 14px;border-radius:20px;font-size:13px;font-weight:600;flex-shrink:0;' +
        (this.state.filter === key ? 'background:#17181D;color:#F6F4EF;' : 'background:#FFFFFF;color:#5B5E68;border:1px solid #E5E2D8;')
    }));
    const items = this.ALL.filter((it) => this.state.filter === 'all' || it.cat === this.state.filter);
    return { chips, items };
  }
}
</script>
</body>
</html>
